<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2f4a7d">
  <meta name="description" content="Flashcards de japonais avec répétition espacée, niveaux et progression.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <title>Flash Jap</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="top">
    <div class="top-inner">
      <div class="badge" id="lvlBadge"><span id="lvlNum">1</span><i class="seal" id="lvlSeal" aria-hidden="true"></i></div>
      <div class="top-main">
        <div class="top-title"><span id="lvlTitle">&nbsp;</span> <span class="tier-name" id="lvlTier"></span></div>
        <div class="bar"><div class="fill" id="lvlFill"></div></div>
      </div>
      <div class="top-xp"><span id="lvlXp"></span> <span id="syncBadge" class="sync-badge" hidden></span></div>
    </div>
  </header>

  <main id="app"></main>
  <footer class="credits">Remerciements · Chat-ssistant Mochi</footer>
  <div id="toasts" aria-live="polite"></div>

  <div id="modal" class="modal" hidden role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-box">
      <h3 id="modalTitle"></h3>
      <p id="modalText"></p>
      <div class="modal-actions">
        <button class="btn" id="modalCancel" type="button">Annuler</button>
        <button class="btn primary" id="modalOk" type="button"></button>
      </div>
    </div>
  </div>

  <input type="file" id="csvFile" accept=".csv,text/csv,text/plain" hidden>
  <input type="file" id="jsonFile" accept=".json,application/json" hidden>

  <script src="js/levels.js"></script>
  <script src="js/srs.js"></script>
  <script src="js/csv.js"></script>
  <script src="js/kanji.js"></script>
  <script src="js/store.js"></script>
  <script src="js/sync-core.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/fx.js"></script>
  <script src="js/app.js"></script>
  <script>
    // Mode hors-ligne + installation sur l'écran d'accueil (uniquement en http/https, pas en ouvrant le fichier)
    if (/^https?:$/.test(location.protocol)) {
      if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () { /* facultatif */ });
      // Synchronisation en ligne (facultative) : si le chargement échoue, l'appli reste locale.
      import('./js/sync.js').catch(function (e) {
        console.warn('Synchronisation indisponible :', e);
        FJ.syncUi = Object.assign(FJ.syncUi || {}, { phase: 'unavailable' });
        if (FJ.ui && FJ.ui.syncChanged) FJ.ui.syncChanged();
      });
    }
  </script>
</body>
</html>
